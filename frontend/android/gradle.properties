# ─── Gradle Performance Optimization ─────────────────────────────────────────

# JVM memory — naikkan dari 1536m ke 4096m untuk build lebih cepat
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m

# Parallel build — build modul secara paralel (signifikan untuk multi-module)
org.gradle.parallel=true

# Build cache — cache hasil build agar incremental build jauh lebih cepat
org.gradle.caching=true

# Configuration cache — cache konfigurasi Gradle (eksperimental tapi stabil)
org.gradle.configuration-cache=true

# Daemon — keep Gradle daemon alive (default sudah true, tapi eksplisit)
org.gradle.daemon=true

# Daemon idle timeout — 30 menit (default 3 jam, hemat memory)
org.gradle.daemon.idletimeout=1800000

# Configure on demand — hanya konfigurasi modul yang dibutuhkan
org.gradle.configureondemand=true

# ─── Android Specific ────────────────────────────────────────────────────────

# AndroidX
android.useAndroidX=true

# Non-transitive R classes — kurangi ukuran R class, build lebih cepat
android.nonTransitiveRClass=true

# Disable unused Android features untuk build lebih cepat
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Kotlin daemon — jika ada Kotlin, share daemon
kotlin.daemon.jvmargs=-Xmx1536m
