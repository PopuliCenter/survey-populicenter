version: '3.8'

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: web_survey_platform
      POSTGRES_USER: surveyapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ganti_password_aman}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveyapp -d web_survey_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: web_survey_platform
      DB_USER: surveyapp
      DB_PASSWORD: ${DB_PASSWORD:-ganti_password_aman}
      JWT_SECRET: ${JWT_SECRET:-ganti_jwt_secret_minimal_64_karakter}
      SESSION_SECRET: ${SESSION_SECRET:-ganti_session_secret_minimal_64_karakter}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      UPLOAD_DIR: uploads/photos
      MAX_FILE_SIZE_MB: 5
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"

  # ── Export Worker ──────────────────────────────────────────
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: web_survey_platform
      DB_USER: surveyapp
      DB_PASSWORD: ${DB_PASSWORD:-ganti_password_aman}
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads:/app/uploads
    command: ["node", "src/workers/index.js"]

  # ── Nginx (reverse proxy + frontend) ──────────────────────
  nginx:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - uploads:/app/uploads:ro

volumes:
  pgdata:
  redisdata:
  uploads:
