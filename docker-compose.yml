services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: web_survey_platform
      POSTGRES_USER: surveyapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib di-set di file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveyapp -d web_survey_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: web_survey_platform
      DB_USER: surveyapp
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib di-set di file .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib di-set di file .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib di-set di file .env}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      UPLOAD_DIR: uploads/photos
      MAX_FILE_SIZE_MB: 5
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - uploads:/app/uploads
    # TIDAK memetakan port ke host — backend hanya diakses via nginx (internal
    # network). Mengekspos 3000 ke internet mem-bypass Cloudflare (WAF/rate-limit/
    # TLS) & memungkinkan spoof CF-Connecting-IP.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Export Worker ──────────────────────────────────────────
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: web_survey_platform
      DB_USER: surveyapp
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib di-set di file .env}
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - uploads:/app/uploads
    command: ["node", "src/workers/index.js"]
    # Worker tak punya HTTP — pakai heartbeat file (ditulis tiap 30s oleh
    # workers/index.js). Sehat bila heartbeat < 3 menit (deteksi worker hang/mati).
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');try{process.exit(Date.now()-(+fs.readFileSync('/tmp/worker-heartbeat','utf8'))<180000?0:1)}catch(e){process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Nginx (reverse proxy + frontend) ──────────────────────
  nginx:
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx-common.conf:/etc/nginx/nginx-common.conf:ro
      - ./certs:/etc/nginx/certs:ro
    # (mount uploads:ro dihapus — /uploads kini diproxy ke backend ber-JWT,
    #  nginx tak lagi menyajikan file dari disk)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  uploads: