# Rotasi log — TANPA ini log JSON Docker tumbuh tanpa batas dan bisa MEMENUHI
# DISK pada survei yang berjalan lama (nginx access log & backend paling deras).
# Batas per service: 3 berkas × 10 MB = maks 30 MB (≈150 MB untuk 5 service).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: web_survey_platform
      POSTGRES_USER: surveyapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib di-set di file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Batas memori (ceiling) — cegah satu service meng-OOM seluruh host.
    # Disetel utk VPS KVM 8 (8 vCPU / 32 GB RAM). Total plafon ±8 GB — sisanya
    # untuk page cache OS (justru mempercepat Postgres & file media).
    # Tuning ringan Postgres agar memakai RAM yang tersedia (default image
    # terlalu konservatif: shared_buffers 128MB).
    command:
      - postgres
      - -c
      - shared_buffers=1024MB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
    mem_limit: 4096m
    # Plafon CPU (host 8 vCPU dipakai 3 stack aplikasi) — cegah satu container
    # menyandera seluruh core saat beban puncak. Ini ceiling, bukan reservasi.
    cpus: 3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveyapp -d web_survey_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redisdata:/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO (object storage media — 12-factor faktor 4) ──────
  # Milik STACK INI (bukan menyandar ke MinIO tetangga) agar isolasi tetap utuh:
  # stack online down TIDAK mematikan media survei lapangan. Hanya di-bind ke
  # 127.0.0.1 (tak pernah ke internet); backend mengaksesnya lewat network
  # internal Docker (`minio:9000`). Idle ~70 MB — dipakai hanya bila
  # MEDIA_STORAGE=s3; sampai saat itu ia siaga tanpa efek.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER wajib di-set di file .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD wajib di-set di file .env}
    volumes:
      - miniodata:/data
    # Bind localhost saja — konsol (9001) & API (9000) tak terekspos ke internet.
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    mem_limit: 1024m
    cpus: 1
    # (Tanpa healthcheck: image server MinIO tak menyertakan `mc`/curl untuk
    #  probe yang andal. restart:unless-stopped + koneksi app yang eksplisit
    #  sudah cukup; backend TIDAK depends_on minio, jadi tak ada restart-loop.)

  # ── Random Sampling Service (Python/FastAPI) ───────────────
  # Engine metodologi (MFD/BPS) untuk menu "Random Sampling" di dashboard.
  # TANPA auth & TANPA port ke host — hanya diakses backend Node (JWT+role)
  # via network internal Docker (`sampling:8000`). Pemakaian sporadis → ringan.
  sampling:
    image: ghcr.io/populicenter/survey-sampling:${IMAGE_TAG:-latest}
    build: ./sampling-service
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8000"
    mem_limit: 1024m
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Backend API ────────────────────────────────────────────
  backend:
    # Produksi: `docker compose pull` mengambil image dari GHCR (dibangun CI).
    # Dev: `docker compose up -d --build` membangun dari ./backend (build tetap
    # ada). IMAGE_TAG=sha-<commit> untuk rollback presisi (default: latest).
    image: ghcr.io/populicenter/survey-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      # Auto-migrate saat container start (entrypoint) — HANYA backend, agar
      # tidak berlomba dengan worker yang memakai image sama. Menghapus kelas
      # outage "deploy tanpa migrate → login 500" (insiden 2026-07-13).
      RUN_MIGRATIONS: "1"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: web_survey_platform
      DB_USER: surveyapp
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib di-set di file .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib di-set di file .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib di-set di file .env}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      UPLOAD_DIR: uploads/photos
      MAX_FILE_SIZE_MB: 5
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Knob rate-limit — DIPLUMBING dari .env (default = nilai di kode). Tanpa
      # baris ini, menyetelnya di .env TAK berefek (compose tak meneruskan env
      # yang tak terdaftar). Ditemukan saat load test 2026-07-17.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-}
      UPLOAD_RATE_LIMIT_MAX: ${UPLOAD_RATE_LIMIT_MAX:-120}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_IP_RATE_LIMIT_MAX: ${LOGIN_IP_RATE_LIMIT_MAX:-100}
      # Penyimpanan media: 'disk' (default, aman) atau 's3' (MinIO). Flip ke s3
      # HANYA setelah migrasi selesai — lihat docs/ops/media-minio.md. Pembacaan
      # punya fallback dua arah, jadi rollback ke disk aman.
      MEDIA_STORAGE: ${MEDIA_STORAGE:-disk}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER wajib di-set di file .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD wajib di-set di file .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-survey-media}
      # Layanan Random Sampling (Python) — hanya via network internal Docker.
      SAMPLING_SERVICE_URL: ${SAMPLING_SERVICE_URL:-http://sampling:8000}
    volumes:
      - uploads:/app/uploads
    # TIDAK memetakan port ke host — backend hanya diakses via nginx (internal
    # network). Mengekspos 3000 ke internet mem-bypass Cloudflare (WAF/rate-limit/
    # TLS) & memungkinkan spoof CF-Connecting-IP.
    expose:
      - "3000"
    mem_limit: 2048m
    cpus: 4
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Export Worker ──────────────────────────────────────────
  worker:
    # Image SAMA dengan backend (satu build, dua peran via command berbeda).
    image: ghcr.io/populicenter/survey-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: web_survey_platform
      DB_USER: surveyapp
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib di-set di file .env}
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Worker membangun arsip ZIP media (archiveBuilder) → butuh akses storage sama.
      MEDIA_STORAGE: ${MEDIA_STORAGE:-disk}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER wajib di-set di file .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD wajib di-set di file .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-survey-media}
    volumes:
      - uploads:/app/uploads
    command: ["node", "src/workers/index.js"]
    mem_limit: 1024m
    cpus: 1.5
    # Worker tak punya HTTP — pakai heartbeat file (ditulis tiap 30s oleh
    # workers/index.js). Sehat bila heartbeat < 3 menit (deteksi worker hang/mati).
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');try{process.exit(Date.now()-(+fs.readFileSync('/tmp/worker-heartbeat','utf8'))<180000?0:1)}catch(e){process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Nginx (reverse proxy + frontend) ──────────────────────
  nginx:
    # Image dibangun CI (SPA + Sentry DSN dipanggang). Config proxy & certs TETAP
    # host-mount (lihat volumes di bawah) → tak ikut di image, jadi image aman
    # dibagikan & config bisa diubah tanpa rebuild.
    image: ghcr.io/populicenter/survey-nginx:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx-common.conf:/etc/nginx/nginx-common.conf:ro
      - ./certs:/etc/nginx/certs:ro
    mem_limit: 256m
    # nginx melayani KETIGA aplikasi (pintu bersama 80/443) — beri jatah cukup
    # agar app tetangga tetap terlayani saat stack ini sedang beban puncak.
    cpus: 2
    # (mount uploads:ro dihapus — /uploads kini diproxy ke backend ber-JWT,
    #  nginx tak lagi menyajikan file dari disk)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  uploads:
  miniodata: