map $http_authorization $is_api_request {
    default  0;
    "~."     1;
}

# ── HTTP (port 80) ──────────────────────────────────────────────────────────
# Tetap MELAYANI aplikasi (bukan redirect) supaya aman walau Cloudflare masih
# mode Flexible (CF konek origin via :80). Redirect http→https ditangani di
# edge Cloudflare ("Always Use HTTPS"), jadi tidak ada risiko redirect loop.
server {
    listen 80;
    server_name risetcenter.com www.risetcenter.com _;
    include /etc/nginx/nginx-common.conf;
}

# ── HTTPS (port 443) — origin TLS pakai Cloudflare Origin Certificate ────────
server {
    listen 443 ssl;
    http2 on;
    server_name risetcenter.com www.risetcenter.com _;

    # Cloudflare Origin Certificate (berlaku 15 tahun, tanpa perpanjangan).
    # File di-mount dari ./certs di host (lihat docker-compose.yml).
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/nginx-common.conf;
}
