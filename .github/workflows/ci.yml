name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama bila ada push baru pada ref yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      # GERBANG: lint frontend 0 error + 0 warning (sudah bersih).
      - name: Lint
        run: npm run lint
      # GERBANG: test unit frontend (209/209 hijau) wajib lulus.
      - name: Test
        run: npm run test:ci
      # GERBANG: build produksi wajib sukses.
      - name: Build
        run: npm run build

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      # GERBANG: lint backend (0 error; warning kosmetik tak menggagalkan).
      - name: Lint
        run: npm run lint
      # GERBANG: seluruh test backend (664/664 hijau, berbasis MOCK — tak butuh
      # DB/Redis nyata). Env dummy hanya untuk lolos fail-fast REQUIRED_ENV di
      # app.js saat modul di-require; bukan rahasia nyata.
      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-dummy-jwt-secret
          SESSION_SECRET: ci-dummy-session-secret
          DB_HOST: localhost
          DB_NAME: ci_test
          DB_USER: ci_test
          DB_PASSWORD: ci_test
