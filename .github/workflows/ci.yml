name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama bila ada push baru pada ref yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      # GERBANG: lint frontend 0 error + 0 warning (sudah bersih).
      - name: Lint
        run: npm run lint
      # GERBANG: test unit frontend (209/209 hijau) wajib lulus.
      - name: Test
        run: npm run test:ci
      # GERBANG: build produksi wajib sukses.
      - name: Build
        run: npm run build

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      # GERBANG: lint backend (0 error; warning kosmetik tak menggagalkan).
      - name: Lint
        run: npm run lint
      # GERBANG: seluruh test backend (664/664 hijau, berbasis MOCK — tak butuh
      # DB/Redis nyata). Env dummy hanya untuk lolos fail-fast REQUIRED_ENV di
      # app.js saat modul di-require; bukan rahasia nyata.
      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-dummy-jwt-secret
          SESSION_SECRET: ci-dummy-session-secret
          DB_HOST: localhost
          DB_NAME: ci_test
          DB_USER: ci_test
          DB_PASSWORD: ci_test

  # ── Publikasi image ke GHCR (12-factor faktor 5) ────────────────────────────
  # Build & push HANYA setelah test lulus, HANYA pada push ke main (bukan PR).
  # Server produksi lalu `docker compose pull` — tak lagi build di produksi.
  # Dua tag: `latest` (deploy default) + `sha-<commit>` (rollback presisi).
  publish-backend:
    name: Publish image backend → GHCR
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag pendek dari commit
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Build & push (backend + worker pakai image sama)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/populicenter/survey-backend:latest
            ghcr.io/populicenter/survey-backend:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=survey-backend
          cache-to: type=gha,scope=survey-backend,mode=max

  publish-nginx:
    name: Publish image nginx (frontend) → GHCR
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag pendek dari commit
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # VITE_SENTRY_DSN dipanggang saat build (keterbatasan SPA). Set sebagai
          # repo secret agar Sentry web aktif; kosong = tanpa Sentry (tetap jalan).
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          tags: |
            ghcr.io/populicenter/survey-nginx:latest
            ghcr.io/populicenter/survey-nginx:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=survey-nginx
          cache-to: type=gha,scope=survey-nginx,mode=max

  publish-sampling:
    name: Publish image sampling (Python) → GHCR
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag pendek dari commit
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./sampling-service
          push: true
          tags: |
            ghcr.io/populicenter/survey-sampling:latest
            ghcr.io/populicenter/survey-sampling:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=survey-sampling
          cache-to: type=gha,scope=survey-sampling,mode=max
