# ── Uploaded files (media PII responden) ────────────────────────────────────
# WAJIB lewat backend (JWT + role). JANGAN sajikan langsung dari disk — dulu
# `alias /app/uploads/` membuat foto/audio/tanda tangan responden bisa diakses
# siapa saja tanpa autentikasi. `^~` tetap dipertahankan agar menang atas regex
# aset statis (.jpg dll) di bawah.
location ^~ /uploads/ {
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

# ── Service worker — JANGAN di-cache (exact match menang atas regex .js) ─────
# Wajib selalu revalidasi agar update SW terdeteksi pada refresh biasa,
# bukan hanya saat hard refresh.
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    try_files $uri =404;
}

# ── Cache static assets (aset ber-hash → aman cache lama) ───────────────────
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webm|mp4|ogg|json|sql)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# ── Embed publik hasil survei — boleh di-iframe oleh populicenter.org ────────
# Mendefinisikan add_header di sini sengaja MENGGANTI X-Frame-Options SAMEORIGIN
# yang diwarisi dari blok induk, lalu mengizinkan framing via CSP frame-ancestors.
# Sesuaikan daftar domain bila website memakai subdomain/origin lain.
location /embed/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy "frame-ancestors 'self' https://populicenter.org https://*.populicenter.org";
    add_header X-Content-Type-Options "nosniff";
    try_files /index.html =404;
}

# ── SPA fallback — catches ALL other routes ────────────────────────────────
# /dashboard, /responses, /reports, /map, /surveys/xxx/builder, /surveyor, etc.
# index.html TIDAK di-cache agar selalu menunjuk aset (hash) terbaru.
location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
}
