# ─────────────────────────────────────────────────────────────────────────────
# nginx-common.conf — body bersama untuk server block :80 dan :443.
# Di-include dari nginx.conf. JANGAN taruh blok `server { }` di sini.
# ─────────────────────────────────────────────────────────────────────────────

client_max_body_size 10M;

# Timeout proxy — beri waktu unggah media (audio/foto) di koneksi lapangan
# yang lambat agar tidak terputus saat banyak TPD menyinkron.
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
client_body_timeout 120s;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS — paksa HTTPS 1 tahun. Aman karena Cloudflare "Always Use HTTPS" aktif;
# browser hanya menghormati header ini pada koneksi HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Kompresi — perkecil transfer JSON API & aset statis (origin→CF & CF→browser).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml application/vnd.ms-fontobject font/ttf font/opentype;

# Frontend static files
root /usr/share/nginx/html;
index index.html;

# Resolver Docker embedded DNS — biar nginx TIDAK resolve "backend" saat
# startup (yang bikin crash "host not found in upstream" kalau backend
# belum siap, mis. setelah reboot). Dengan variabel di proxy_pass, resolusi
# ditunda sampai ada request.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_upstream backend;

# ── Named location: sajikan SPA shell (dipakai pola error_page 418 = @spa) ───
# Untuk path yang berbenturan dgn rute frontend: bila request TANPA Authorization
# (navigasi/hard-refresh browser), alihkan ke sini agar memuat aplikasi.
location @spa {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
}

# ── API-only endpoints (no frontend route conflict) ────────────────────────
location /auth       { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
location /admins     { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
location /supervisors { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
location /viewers    { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
location /partner-lokal { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
location /asisten-supervisor { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
location /upload     { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
location /audit-logs { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
# /monitoring/* — API status sistem (admin). Halaman SPA-nya di /system (beda prefix), jadi tak perlu diskriminasi 418.
location /monitoring { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
# /storage/* — API manajemen penyimpanan (admin). Halaman SPA di /penyimpanan.
# Unduh arsip ZIP bisa besar & streamed → matikan buffering + timeout longgar.
location /storage {
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
# /cleanup juga rute frontend → API hanya bila ada Authorization, selain itu SPA
location /cleanup {
    error_page 418 = @spa;
    if ($http_authorization = "") { return 418; }
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
location /health     { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
# Healthcheck lokal nginx — TIDAK mem-proxy ke backend (cek nginx-nya sendiri
# hidup, lepas dari status backend). Dipakai Docker healthcheck.
location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
# /public/* — API hasil survei publik (tanpa login), dipakai website populicenter.org
location /public     { proxy_pass http://$backend_upstream:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $http_cf_connecting_ip; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }

# ── Shared routes (API + frontend) ─────────────────────────────────────────
# Strategi: proxy ke backend HANYA jika ada sub-path API (stats, trend, dll)
# atau jika path exact match API pattern. Browser refresh = fallback ke SPA.

# /dashboard/* endpoint API (stats, trend, peta provinsi, pola waktu, kualitas, dll)
location ~ ^/dashboard/(stats|trend|top-surveyors|survey-progress|surveyor-summary|responses-by-province|time-pattern|data-quality) {
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

# /surveys/:uuid/* — sub-endpoint API (questions, export, publish, monitoring, dll).
# Semua butuh Authorization (axios) & bukan rute frontend → selalu ke backend.
location ~ ^/surveys/[0-9a-f-]+/(questions|export|publish|unpublish|publication|region-targets|report-config|monitoring|activate|deactivate|clone) {
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
location ~ ^/surveys/[0-9a-f-]+$ {
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
location = /surveys {
    error_page 418 = @spa;
    if ($http_authorization = "") { return 418; }
    proxy_pass http://$backend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

